spring:
  application:
    name: finguard-core
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: "jdbc:mysql://127.0.0.1:${MYSQL_PORT:3306}/${MYSQL_DATABASE:finguard}?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Shanghai"
    username: "${MYSQL_USER:finguard}"
    password: "${MYSQL_PASSWORD}"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
