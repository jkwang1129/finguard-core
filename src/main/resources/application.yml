spring:
  application:
    name: finguard-core
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: "jdbc:mysql://127.0.0.1:${MYSQL_PORT:3306}/${MYSQL_DATABASE:finguard}?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Shanghai"
    username: "${MYSQL_USER:finguard}"
    password: "${MYSQL_PASSWORD}"
  rabbitmq:
    host: "${RABBITMQ_HOST:127.0.0.1}"
    port: "${RABBITMQ_PORT:5672}"
    username: "${RABBITMQ_USERNAME:finguard}"
    password: "${RABBITMQ_PASSWORD}"
    virtual-host: "${RABBITMQ_VIRTUAL_HOST:/}"
    connection-timeout: 5s
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
      file-size-threshold: 5MB

finguard:
  auth:
    bootstrap:
      enabled: "${FINGUARD_AUTH_BOOTSTRAP_ENABLED:false}"
      admin:
        username: "${FINGUARD_AUTH_BOOTSTRAP_ADMIN_USERNAME:}"
        password: "${FINGUARD_AUTH_BOOTSTRAP_ADMIN_PASSWORD:}"
      reviewer:
        username: "${FINGUARD_AUTH_BOOTSTRAP_REVIEWER_USERNAME:}"
        password: "${FINGUARD_AUTH_BOOTSTRAP_REVIEWER_PASSWORD:}"
    jwt:
      secret-base64: "${JWT_SECRET_BASE64:}"
      issuer: "finguard-core"
      expires-in-seconds: 7200

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
