spring:
  application:
    name: finguard-core
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: "jdbc:mysql://127.0.0.1:${MYSQL_PORT:3306}/${MYSQL_DATABASE:finguard}?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Shanghai"
    username: "${MYSQL_USER:finguard}"
    password: "${MYSQL_PASSWORD}"
  rabbitmq:
    host: "${RABBITMQ_HOST:127.0.0.1}"
    port: "${RABBITMQ_PORT:5672}"
    username: "${RABBITMQ_USERNAME:finguard}"
    password: "${RABBITMQ_PASSWORD}"
    virtual-host: "${RABBITMQ_VIRTUAL_HOST:/}"
    connection-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
      file-size-threshold: 5MB

finguard:
  risk:
    large-amount:
      enabled: "${FINGUARD_RISK_LARGE_AMOUNT_ENABLED:true}"
      threshold: "${FINGUARD_RISK_LARGE_AMOUNT_THRESHOLD:10000.00}"
    possible-duplicate:
      enabled: "${FINGUARD_RISK_POSSIBLE_DUPLICATE_ENABLED:true}"
      window: "${FINGUARD_RISK_POSSIBLE_DUPLICATE_WINDOW:5m}"
    frequent-transaction:
      enabled: "${FINGUARD_RISK_FREQUENT_TRANSACTION_ENABLED:true}"
      window: "${FINGUARD_RISK_FREQUENT_TRANSACTION_WINDOW:10m}"
      threshold-count: "${FINGUARD_RISK_FREQUENT_TRANSACTION_THRESHOLD_COUNT:5}"
  messaging:
    import-consumer:
      enabled: "${FINGUARD_IMPORT_CONSUMER_ENABLED:true}"
      concurrency: "${FINGUARD_IMPORT_CONSUMER_CONCURRENCY:1}"
      prefetch: "${FINGUARD_IMPORT_CONSUMER_PREFETCH:1}"
    reconciliation-consumer:
      enabled: "${FINGUARD_RECONCILIATION_CONSUMER_ENABLED:true}"
      concurrency: "${FINGUARD_RECONCILIATION_CONSUMER_CONCURRENCY:1}"
      prefetch: "${FINGUARD_RECONCILIATION_CONSUMER_PREFETCH:1}"
    consumer-forward:
      confirm-timeout: "${FINGUARD_CONSUMER_FORWARD_CONFIRM_TIMEOUT:5s}"
    outbox:
      enabled: "${FINGUARD_OUTBOX_ENABLED:true}"
      fixed-delay-ms: "${FINGUARD_OUTBOX_FIXED_DELAY_MS:1000}"
      batch-size: "${FINGUARD_OUTBOX_BATCH_SIZE:50}"
      confirm-timeout: "${FINGUARD_OUTBOX_CONFIRM_TIMEOUT:5s}"
  auth:
    bootstrap:
      enabled: "${FINGUARD_AUTH_BOOTSTRAP_ENABLED:false}"
      admin:
        username: "${FINGUARD_AUTH_BOOTSTRAP_ADMIN_USERNAME:}"
        password: "${FINGUARD_AUTH_BOOTSTRAP_ADMIN_PASSWORD:}"
      reviewer:
        username: "${FINGUARD_AUTH_BOOTSTRAP_REVIEWER_USERNAME:}"
        password: "${FINGUARD_AUTH_BOOTSTRAP_REVIEWER_PASSWORD:}"
    jwt:
      secret-base64: "${JWT_SECRET_BASE64:}"
      issuer: "finguard-core"
      expires-in-seconds: 7200

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
